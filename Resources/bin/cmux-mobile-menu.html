<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark"><title>cmux Developer Mobile</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e2e7f3;background:#141824;--muted:#919cb1;--accent:#c5b6ff;--line:#ffffff12;--panel:#1d2333}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#262d40;border-radius:12px;padding:10px 13px;min-height:44px}button:hover{background:#333c54}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.4;cursor:default}header{padding:12px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:#181d2b}.brand{width:32px;height:32px;border-radius:10px;background:#c5b6ff19;color:var(--accent);display:grid;place-items:center;font:700 17px monospace;flex:none}.heading{flex:1;min-width:0}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}.heading strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}#sessionsButton{color:var(--accent);background:#c5b6ff13;display:flex;gap:8px;align-items:center}#count{font-size:11px;background:#c5b6ff22;padding:3px 6px;border-radius:6px}.bar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);min-height:43px}.dot{width:6px;height:6px;background:#8fd8b0;border-radius:50%;box-shadow:0 0 8px #8fd8b044}.status{font-size:11px;color:var(--muted);flex:1}#terminalPicker{background:#202738;color:#dbe2f3;border:1px solid var(--line);border-radius:8px;padding:5px;max-width:50%;font-size:11px}main{flex:1;min-height:0;position:relative}iframe{width:100%;height:100%;border:0;background:#141824}#nativeView{position:absolute;inset:0;overflow:auto;padding:15px 12px;overscroll-behavior:contain;background:#1c202b}#grid{position:relative;font:14px/1.4 ui-monospace,Menlo,"DejaVu Sans Mono",monospace;white-space:pre;user-select:text;direction:ltr}.row{height:1.4em;position:relative}.run{position:absolute;top:0;overflow:hidden;white-space:pre}.cursor{position:absolute;width:1ch;height:1.4em;background:#bbadff55;pointer-events:none}.controls{padding:8px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#181d2b}#keys{display:flex;gap:6px;overflow:auto;padding-bottom:7px}#keys button{min-width:44px;min-height:36px;padding:6px 10px;font-size:12px;background:#202738;border-radius:9px}.compose{display:flex;gap:8px;align-items:flex-end}textarea{resize:none;flex:1;min-width:0;max-height:110px;min-height:44px;padding:11px 12px;border:1px solid #ffffff15;border-radius:12px;background:#121723;color:#e2e7f3;font-size:14px}#send{background:var(--accent);color:#201b32;font-weight:600}.toast{color:#edc68f;background:#edc68f0b;padding:8px 16px;font-size:12px;border-bottom:1px solid #edc68f20}dialog{color:#e2e7f3;background:var(--panel);border:1px solid #ffffff15;border-radius:22px;padding:0;width:min(450px,calc(100vw - 24px));max-height:85dvh;box-shadow:0 20px 80px #0008}dialog::backdrop{background:#090d17bb;backdrop-filter:blur(6px)}.drawerHead{padding:22px 20px 12px;display:flex;align-items:center;justify-content:space-between}.drawerHead h2{margin:0;font-size:20px}.drawerHead p{font-size:12px;color:var(--muted);margin:6px 0 0}.drawerHead button{background:transparent;border:0;font-size:20px}.search{margin:0 20px 12px;width:calc(100% - 40px);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#141a29;color:inherit}#sessionList{padding:0 12px 14px;max-height:55dvh;overflow:auto}.session{width:100%;display:flex;align-items:center;text-align:start;background:transparent;margin:4px 0;border-radius:14px;gap:12px;padding:13px 12px}.session.active{border-color:#c5b6ff55;background:#c5b6ff12}.icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#859bd21a;color:#b7c8ef;font:15px monospace;flex:none}.sessionInfo{flex:1;min-width:0}.sessionInfo strong{font-size:14px;display:block}.sessionInfo small{font-size:11px;display:block;color:var(--muted);padding-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chevron{color:var(--muted);font-size:20px}.drawerFoot{border-top:1px solid var(--line);padding:12px 20px;font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:center}.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}[hidden]{display:none!important}@media(min-width:800px){header,.bar{padding-left:24px;padding-right:24px}.heading strong{font-size:16px}.controls{padding-left:24px;padding-right:24px}.compose{max-width:900px;margin:auto}#keys{max-width:900px;margin:auto}}
</style>

<body>
<header><div class="brand">&gt;_</div><div class="heading"><div class="eyebrow">cmux Developer</div><strong id="currentTitle" data-i18n="shared"></strong></div><button id="sessionsButton" aria-haspopup="dialog"><span>☰</span><span data-i18n="sessions"></span><span id="count">…</span></button></header>
<div class="bar"><span class="dot"></span><span class="status" id="status" data-i18n="private"></span><select id="terminalPicker" hidden></select><button id="sharedButton" data-i18n="sharedShort" style="font-size:11px;padding:5px 9px;min-height:30px"></button></div>
<div id="notice" class="toast" role="status" hidden></div>
<main><iframe id="sharedTerminal" src="/terminal/" title="Terminal"></iframe><div id="nativeView" hidden><div id="grid" role="region" aria-label="Terminal"></div></div></main>
<footer class="controls" id="controls" hidden><div id="keys"><button data-key="escape">Esc</button><button data-key="tab">Tab</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="left">←</button><button data-key="right">→</button><button data-key="enter">↵</button><button data-key="interrupt">Ctrl+C</button></div><form class="compose" id="composer"><textarea id="message" rows="1" autocomplete="off" autocorrect="off" spellcheck="false"></textarea><button id="send" type="submit" data-i18n="send"></button></form></footer>
<dialog id="sessionDialog"><div class="drawerHead"><div><h2 data-i18n="sessions"></h2><p data-i18n="choose"></p></div><button id="closeDialog">×</button></div><input class="search" id="search" type="search" autocomplete="off"><div id="sessionList"></div><div class="drawerFoot"><span class="dot"></span><span data-i18n="keepRunning"></span></div></dialog>

de:{sessions:'Sitzungen',shared:'Geteilte Sitzung',sharedShort:'Geteilt',private:'Private Verbindung',choose:'Deine Arbeitsbereiche auf dem Mac',send:'Senden',prompt:'In dieser Sitzung schreiben…',search:'Sitzung suchen…',keepRunning:'Beim Wechsel laufen die Agenten weiter.',empty:'Keine Sitzungen verfügbar.',readonly:'Nur lesen',live:'Live verbunden',unavailable:'Die App antwortet nicht. Prüfe, ob cmux geöffnet ist.',gone:'Diese Sitzung ist nicht mehr verfügbar. Wähle eine andere.',expired:'Der Zugriff ist abgelaufen. Teile erneut vom Mac.',failed:'Die Aktion ist fehlgeschlagen. Versuche es erneut.',close:'Menü schließen',terminal:'Terminal',retry:'Erneut versuchen'},

ar:{sessions:'الجلسات',shared:'الجلسة المشتركة',sharedShort:'مشتركة',private:'اتصال خاص',choose:'مساحات العمل على جهاز Mac',send:'إرسال',prompt:'اكتب في هذه الجلسة…',search:'ابحث عن جلسة…',keepRunning:'تستمر الوكلاء بالعمل عند تبديل الجلسة.',empty:'لا توجد جلسات متاحة.',readonly:'للقراءة فقط',live:'مباشر',unavailable:'التطبيق لا يستجيب. تأكد من أن cmux مفتوح.',gone:'هذه الجلسة لم تعد متاحة. اختر جلسة أخرى.',expired:'انتهت صلاحية الوصول. شارك مجددًا من Mac.',failed:'تعذر إكمال الإجراء. حاول مجددًا.',close:'إغلاق القائمة',terminal:'الطرفية',retry:'إعادة المحاولة'},

ko:{sessions:'세션',shared:'공유 세션',sharedShort:'공유',private:'비공개 연결',choose:'Mac의 작업 공간',send:'보내기',prompt:'이 세션에 입력…',search:'세션 검색…',keepRunning:'세션을 전환해도 에이전트는 계속 실행됩니다.',empty:'사용 가능한 세션이 없습니다.',readonly:'읽기 전용',live:'실시간',unavailable:'앱이 응답하지 않습니다. cmux가 열려 있는지 확인하세요.',gone:'이 세션은 더 이상 사용할 수 없습니다. 다른 세션을 선택하세요.',expired:'접근 시간이 만료되었습니다. Mac에서 다시 공유하세요.',failed:'작업을 완료하지 못했습니다. 다시 시도하세요.',close:'메뉴 닫기',terminal:'터미널',retry:'다시 시도'},

};
const language=navigator.language||'es'; const locale=language.startsWith('zh')?(language.match(/TW|HK|Hant/)?'zh-Hant':'zh-Hans'):language.split('-')[0]; const t=copy[locale]||copy.en;
document.documentElement.lang=locale; if(locale==='ar')document.documentElement.dir='rtl';
for(const node of document.querySelectorAll('[data-i18n]'))node.textContent=t[node.dataset.i18n];
const $=id=>document.getElementById(id); $('search').placeholder=t.search; $('message').placeholder=t.prompt; $('closeDialog').setAttribute('aria-label',t.close); $('terminalPicker').setAttribute('aria-label',t.terminal);
let catalog={workspaces:[],readonly:true}, current=null, surface=null, csrf='', generation=0, polling=false, lastGrid=null;
function notice(key){$('notice').textContent=t[key]||t.failed;$('notice').hidden=false;}
function clearNotice(){$('notice').hidden=true;}
async function api(path,options={}){const response=await fetch(path,{cache:'no-store',...options});let result;try{result=await response.json();}catch{throw Error('unavailable');}if(!response.ok)throw Error(result.error==='expired'?'expired':result.error==='session_gone'?'gone':result.error==='readonly'?'readonly':'unavailable');return result;}
async function loadCatalog(){try{catalog=await api('/api/sessions');csrf=catalog.csrf;$('count').textContent=String(catalog.workspaces.length);$('send').disabled=catalog.readonly;renderMenu();if(current&&!catalog.workspaces.some(w=>w.id===current.id)){current=null;surface=null;generation++;notice('gone');}}catch(error){notice(error.message);}}
function renderMenu(){const list=$('sessionList');list.replaceChildren();const query=$('search').value.trim().toLocaleLowerCase();const rows=catalog.workspaces.filter(w=>(w.title+' '+w.directory).toLocaleLowerCase().includes(query));for(const workspace of rows){const button=document.createElement('button');button.className='session'+(current?.id===workspace.id?' active':'');button.dataset.workspace=workspace.id;const icon=document.createElement('span');icon.className='icon';icon.textContent='>_';const info=document.createElement('span');info.className='sessionInfo';const title=document.createElement('strong');title.textContent=workspace.title;const subtitle=document.createElement('small');subtitle.textContent=workspace.directory+(workspace.unread?' · ●':'');info.append(title,subtitle);const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent=current?.id===workspace.id?'✓':'›';button.append(icon,info,arrow);button.addEventListener('click',()=>choose(workspace));list.append(button);}if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t.empty;list.append(empty);}}
function choose(workspace){current=workspace;surface=workspace.terminals.find(item=>item.is_focused)||workspace.terminals[0];generation++;lastGrid=null;$('currentTitle').textContent=workspace.title;$('sharedTerminal').hidden=true;$('sharedTerminal').src='about:blank';$('nativeView').hidden=false;$('controls').hidden=catalog.readonly;$('status').textContent=catalog.readonly?t.readonly:t.live;$('terminalPicker').replaceChildren();workspace.terminals.forEach((item,index)=>{const option=document.createElement('option');option.value=item.id;option.textContent=(index+1)+' · '+item.title;$('terminalPicker').append(option);});$('terminalPicker').value=surface.id;$('terminalPicker').hidden=workspace.terminals.length<2;$('sessionDialog').close();$('message').value='';clearNotice();renderMenu();poll();}
function color(value,fallback){return /^#[0-9a-f]{6}$/i.test(value||'')?value:fallback;}
function render(grid){const signature=JSON.stringify([grid.columns,grid.rows,grid.cursor,grid.row_spans,grid.styles]);if(signature===lastGrid)return;lastGrid=signature;const view=$('nativeView');const atBottom=view.scrollTop+view.clientHeight>=view.scrollHeight-50;const element=$('grid');const styles=new Map(grid.styles.map(style=>[style.id,style]));element.style.width=grid.columns+'ch';element.style.background=color(grid.terminal_background,'#1c202b');element.style.color=color(grid.terminal_foreground,'#d8deec');const rows=Array.from({length:grid.rows},()=>{const row=document.createElement('div');row.className='row';return row;});for(const run of grid.row_spans){if(!rows[run.row]||run.column<0||run.column>=grid.columns)continue;const span=document.createElement('span');span.className='run';span.style.left=run.column+'ch';span.style.width=run.cell_width+'ch';span.textContent=run.text;const style=styles.get(run.style_id)||{};let fg=color(style.foreground,'#d8deec'),bg=color(style.background,'#1c202b');if(style.inverse)[fg,bg]=[bg,fg];span.style.color=style.invisible?bg:fg;span.style.background=bg;span.style.fontWeight=style.bold?'700':'400';span.style.fontStyle=style.italic?'italic':'normal';span.style.opacity=style.faint?'.65':'1';span.style.textDecoration=[style.underline?'underline':'',style.strikethrough?'line-through':'',style.overline?'overline':''].filter(Boolean).join(' ');rows[run.row].append(span);}if(grid.cursor?.visible&&rows[grid.cursor.row]){const cursor=document.createElement('span');cursor.className='cursor';cursor.style.left=grid.cursor.column+'ch';rows[grid.cursor.row].append(cursor);}element.replaceChildren(...rows);if(atBottom)view.scrollTop=view.scrollHeight;}
async function poll(){if(polling||!current||!surface||document.hidden)return;polling=true;const selectedGeneration=generation;try{const result=await api('/api/replay?workspace='+encodeURIComponent(current.id)+'&surface='+encodeURIComponent(surface.id));if(selectedGeneration===generation){render(result.grid);clearNotice();}}catch(error){if(selectedGeneration===generation)notice(error.message);}finally{polling=false;}}
async function input(payload){if(!current||!surface||catalog.readonly)return;const selectedGeneration=generation;const target={workspace_id:current.id,surface_id:surface.id,...payload};try{await api('/api/input',{method:'POST',headers:{'Content-Type':'application/json','X-Cmux-Action':csrf},body:JSON.stringify(target)});if(selectedGeneration===generation){clearNotice();poll();}return true;}catch(error){notice(error.message);return false;}}
$('sessionsButton').addEventListener('click',()=>{$('sessionDialog').showModal();renderMenu();loadCatalog();});$('closeDialog').addEventListener('click',()=>$('sessionDialog').close());$('sessionDialog').addEventListener('click',event=>{if(event.target===$('sessionDialog'))$('sessionDialog').close();});$('search').addEventListener('input',renderMenu);$('terminalPicker').addEventListener('change',()=>{surface=current.terminals.find(item=>item.id===$('terminalPicker').value);generation++;lastGrid=null;poll();});$('sharedButton').addEventListener('click',()=>{current=null;surface=null;generation++;$('sharedTerminal').src='/terminal/';$('sharedTerminal').hidden=false;$('nativeView').hidden=true;$('controls').hidden=true;$('terminalPicker').hidden=true;$('currentTitle').textContent=t.shared;$('status').textContent=t.private;clearNotice();renderMenu();});for(const button of document.querySelectorAll('[data-key]'))button.addEventListener('click',()=>input({key:button.dataset.key}));$('composer').addEventListener('submit',async event=>{event.preventDefault();const text=$('message').value;if(text&&await input({text:text+'\r'}))$('message').value='';});document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadCatalog();poll();}});setInterval(()=>{if(!document.hidden)poll();},1000);setInterval(()=>{if(!document.hidden)loadCatalog();},5000);loadCatalog();
</script>
